<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LeadFlow – דשבורד פשוט לניהול לידים לעסק קטן של מאמנת מנטלית.">
  <meta name="theme-color" content="#6b5ce7">
  <title>LeadFlow</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>

  <div class="app-shell">
    <!-- Desktop sidebar / mobile top bar share the brand -->
    <aside class="sidebar" aria-label="ניווט ראשי">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LF</span>
        <span class="brand-name">LeadFlow</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <a class="btn btn-primary sidebar-new-lead" href="#/leads/new">
        <span aria-hidden="true">+</span> ליד חדש
      </a>
    </aside>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LF</span>
        <span class="brand-name">LeadFlow</span>
      </div>
    </header>

    <p id="sync-status" class="sync-status" role="status" hidden></p>

    <main id="main" class="main" tabindex="-1">
      <noscript>כדי להפעיל את LeadFlow יש לאפשר JavaScript בדפדפן.</noscript>
    </main>

    <a class="fab" href="#/leads/new" aria-label="הוספת ליד חדש">
      <span aria-hidden="true">+</span>
      <span class="fab-label">ליד חדש</span>
    </a>

    <nav class="bottom-nav" id="bottom-nav" aria-label="ניווט ראשי"></nav>
  </div>
</body>
</html>
