<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LeadFlow – a simple lead dashboard for a small coaching business.">
  <meta name="theme-color" content="#6b5ce7">
  <title>LeadFlow</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app-shell">
    <!-- Desktop sidebar / mobile top bar share the brand -->
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LF</span>
        <span class="brand-name">LeadFlow</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <a class="btn btn-primary sidebar-new-lead" href="#/leads/new">
        <span aria-hidden="true">+</span> New Lead
      </a>
    </aside>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LF</span>
        <span class="brand-name">LeadFlow</span>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1">
      <noscript>LeadFlow needs JavaScript to run.</noscript>
    </main>

    <a class="fab" href="#/leads/new" aria-label="Add new lead">
      <span aria-hidden="true">+</span>
      <span class="fab-label">New Lead</span>
    </a>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
  </div>
</body>
</html>
